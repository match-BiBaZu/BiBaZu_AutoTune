[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bibazu-autotune"
version = "0.1.0"
description = "Manuell freigegebene BiBaZu-Parameterreihen mit Kamera-Messprotokoll"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6,<7",
    "httpx>=0.28,<1",
    "pyads>=3.6,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.9,<3",
    "PyYAML>=6,<7",
    "numpy>=1.26,<3",
    "trimesh>=4.12,<6",
    "shapely>=2.1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
bibazu-autotune = "bibazu_autotune.app:main"
bibazu-autotune-api = "bibazu_autotune.pressure_service:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bibazu_autotune"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
